name: CI

# Puerta de calidad: lint + typecheck + guard de copy + tests + build. Corre en
# cada PR y en los push a main para que ninguna regresión llegue a producción.
on:
  pull_request:
  push:
    branches: [main]

# El workflow solo lee el repo; limita el GITHUB_TOKEN al mínimo.
permissions:
  contents: read

# Cancela ejecuciones antiguas de la misma rama/PR si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Regla #1 del producto: Attesta NO certifica. Un texto que insinúe
      # certificación, conformidad garantizada o asesoría legal es un pasivo
      # legal, no un bug de estilo: aquí deja de depender de la disciplina humana.
      # El script se autoprueba (MUST_CATCH / MUST_PASS) antes de escanear, así
      # que también falla si alguien debilita una de sus reglas.
      - name: Copy prohibido (Attesta NO certifica)
        run: npm run check:copy

      # Red de seguridad del contenido "cero LLM": lint/tsc/build compilan
      # perfectamente una regla legal mal editada (un `if` invertido en la
      # clasificación de riesgo produce un veredicto equivocado sobre el EU AI
      # Act). Estos tests codifican la expectativa regulatoria y la paridad ES/EN.
      - name: Tests (lógica pura)
        run: npm test

      # Build sin credenciales → modo demo (self-contained, sin red). Verifica que
      # el bundle compila. El build real de producción lo hace Vercel con las vars
      # NEXT_PUBLIC_* reales; aquí solo comprobamos que no hay errores de build.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
